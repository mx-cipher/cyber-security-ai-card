<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Security & AI Hub Card</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="card">
        <div class="card-header">
            <div class="status-badge">
                <div class="status-dot"></div>
                Active Node
            </div>
            <div class="node-id">ctx//mx-cipher</div>
        </div>

        <div class="profile-section">
            <div class="avatar-wrapper">
                <div class="avatar-glow"></div>
                <div class="avatar">MX</div>
            </div>
            <h2 class="name">Mehedi Hasan</h2>
            <p class="title">Cyber Security & AI Dev</p>
        </div>

        <div class="metrics-grid">
            <div class="metric-box">
                <div class="metric-label">System Status</div>
                <div class="metric-value secure">SECURE</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Automations</div>
                <div class="metric-value">24 Active</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Core Focus</div>
                <div class="metric-value">SecOps</div>
            </div>
            <div class="metric-box">
                <div class="metric-label">Deployment</div>
                <div class="metric-value">v2.0.26</div>
            </div>
        </div>

        <a href="https://github.com/mx-cipher" target="_blank" class="action-btn">
            Connect to Terminal
        </a>

        <div class="terminal-foot">
            © 2026 mx-cipher // System Initialized successfully.
        </div>
    </div>

</body>
</html>
